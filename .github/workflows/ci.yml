name: CI

on:
  push:
  pull_request:

env:
  # Made-up values for a throwaway test database that exists only during the run.
  MYSQL_ROOT_PASSWORD: ci-root-password
  MYSQL_DATABASE: escapecenter
  MYSQL_USER: escape
  MYSQL_PASSWORD: ci-db-password
  APP_ADMIN_USER: admin
  APP_ADMIN_PASSWORD: ci-admin-password

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: escapecenter
          MYSQL_USER: escape
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        working-directory: Server_Side/EscapeCenter_Server
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client_Side/EscapeCenter_Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client_Side/EscapeCenter_Web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build