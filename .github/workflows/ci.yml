name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        working-directory: Server_Side/EscapeCenter_Server
        run: ./mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: Server_Side/EscapeCenter_Server/target/site/jacoco

  notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        working-directory: Server_Side/notification-service
        run: ./mvnw -B clean verify
        env:
          # Only read by the app itself; the tests use their own containers.
          MYSQL_USER: unused
          MYSQL_PASSWORD: unused

  staff-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        working-directory: Server_Side/EscapeCenter_DemoApp
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client_Side/EscapeCenter_Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client_Side/EscapeCenter_Web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run

  # Starts the whole stack on an empty database, the way a first-time visitor does.
  stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with random passwords
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 12)"
            echo "MYSQL_DATABASE=escapecenter"
            echo "MYSQL_USER=escape"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 12)"
            echo "APP_ADMIN_USER=admin"
            echo "APP_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "RABBITMQ_USER=escape"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 12)"
          } > .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check the API and the site
        run: |
          curl --fail --silent http://localhost:8080/actuator/health
          curl --fail --silent http://localhost:8080/api/rooms > /dev/null
          curl --fail --silent http://localhost/ > /dev/null
      - name: Show logs when it failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker:
    needs: [backend, notification-service, staff-app, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE_PREFIX: ghcr.io/tonnygol/escapecenter
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Server_Side/EscapeCenter_Server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY_IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE_PREFIX }}-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: Server_Side/notification-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY_IMAGE_PREFIX }}-notification:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE_PREFIX }}-notification:latest
      - uses: docker/build-push-action@v6
        with:
          context: Client_Side/EscapeCenter_Web
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY_IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE_PREFIX }}-web:latest
