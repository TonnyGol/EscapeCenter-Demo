spring.application.name=EscapeCenter-Demo

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/escapecenter}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Entities are mapped to responses inside the service, so no database session is needed during JSON writing.
spring.jpa.open-in-view=false

# Origins allowed to call the API from a browser: Vite dev, CRA dev, and the Docker web site on port 80.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

app.admin.user=${APP_ADMIN_USER}
app.admin.password=${APP_ADMIN_PASSWORD}
