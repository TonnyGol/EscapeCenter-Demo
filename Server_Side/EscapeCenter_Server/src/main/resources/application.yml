spring:
  application:
    name: EscapeCenter-Demo
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/escapecenter}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    # Entities are mapped to responses inside the service, so no database session is needed during JSON writing.
    open-in-view: false

app:
  # Origins allowed to call the API from a browser: Vite dev, CRA dev, and the Docker web site on port 80.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  booking:
    # Customers cannot book further ahead than this; staff can.
    max-days-ahead: 120
  rate-limit:
    # Per client address and minute. Staff calls and failed logins both carry an Authorization header.
    bookings-per-minute: 10
    authenticated-per-minute: 30
  admin:
    user: ${APP_ADMIN_USER}
    password: ${APP_ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
server:
  shutdown: graceful
