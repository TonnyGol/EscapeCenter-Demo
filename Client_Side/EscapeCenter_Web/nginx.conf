server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The site and the API share one address, so the browser (a phone too) needs no CORS and no API address.
    # The variable makes nginx look "api" up per request (Docker's DNS), so nginx still starts when the API is down.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # serve static
    location / {
        try_files $uri $uri/ /index.html;
    }
}
